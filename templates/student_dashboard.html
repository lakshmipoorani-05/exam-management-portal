{% extends "base.html" %}

{% block content %}
<h3 class="mb-3">Welcome, {{ g.user.name }}</h3>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card text-center shadow-sm"><div class="card-body">
      <div class="fs-2 fw-bold">{{ open_exams|length }}</div><div class="text-muted">Exams open for booking</div>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card text-center shadow-sm"><div class="card-body">
      <div class="fs-2 fw-bold">{{ available_slots }}</div><div class="text-muted">Available slots</div>
    </div></div>
  </div>
</div>

<a class="btn btn-primary" href="{{ url_for('student_exams') }}">Browse examinations</a>
{% endblock %}
