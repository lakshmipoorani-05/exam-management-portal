{% extends "base.html" %}

{% block content %}
<h3 class="mb-3">Students</h3>

<table class="table table-striped bg-white">
  <thead>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Roll no.</th><th>Phone</th><th>Status</th></tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.email }}</td>
      <td>{{ s.roll_no or "" }}</td>
      <td>{{ s.phone or "" }}</td>
      <td>{{ s.status }}</td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="text-center text-muted">No students yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
