<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Examination Management Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">EMP</a>
        <div>
        {% if g.user %}
          <span class="text-white me-2">{{ g.user.name }} ({{ g.user.role }})</span>
          <a class="btn btn-light btn-sm" href="/logout">Logout</a>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="/login">Login</a>
          <a class="btn btn-light btn-sm" href="/register">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

</body>
</html>
