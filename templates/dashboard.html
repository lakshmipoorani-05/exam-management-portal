{% extends "base.html" %}

{% block content %}
<h3>Welcome, {{ g.user.name }}</h3>
<p>Role: {{ g.user.role }} | Status: {{ g.user.status }}</p>

{% if g.user.role == "examiner" and g.user.status == "pending" %}
  <div class="alert alert-warning">Your examiner account is waiting for admin approval.</div>
{% endif %}
{% endblock %}
