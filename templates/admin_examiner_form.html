{% extends "base.html" %}

{% block content %}
<h3>Add Examiner</h3>
<form method="post" class="card card-body col-md-6">
  <div class="mb-3">
    <label class="form-label">Full name</label>
    <input name="name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Temporary password (at least 6 characters)</label>
    <input type="password" name="password" minlength="6" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input name="phone" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Department</label>
    <input name="department" class="form-control">
  </div>
  <button class="btn btn-primary">Add examiner</button>
  <a class="btn btn-link" href="{{ url_for('admin_examiners') }}">Cancel</a>
</form>
{% endblock %}
