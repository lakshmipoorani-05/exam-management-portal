{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Courses</h3>
  <a class="btn btn-primary" href="{{ url_for('admin_course_new') }}">+ New Course</a>
</div>

<table class="table table-striped bg-white">
  <thead>
    <tr><th>ID</th><th>Code</th><th>Name</th><th>Credits</th><th>Status</th><th></th></tr>
  </thead>
  <tbody>
    {% for c in courses %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.code }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.credits }}</td>
      <td>{{ c.status }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin_course_edit', course_id=c.id) }}">Edit</a>
        <form method="post" action="{{ url_for('admin_course_delete', course_id=c.id) }}" class="d-inline">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="text-center text-muted">No courses yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
