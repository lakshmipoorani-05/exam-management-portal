{% extends "base.html" %}

{% block content %}
<h3>{{ "Edit" if slot else "New" }} Slot</h3>

{% if not slot and not exams %}
  <div class="alert alert-info">No examination assigned to you is open for slot creation right now.</div>
{% else %}
<form method="post" class="card card-body col-md-7">
  {% if slot %}
    <p class="mb-3"><b>{{ slot.exam.name }}</b></p>
  {% else %}
  <div class="mb-3">
    <label class="form-label">Examination</label>
    <select name="exam_id" class="form-select" required>
      {% for e in exams %}<option value="{{ e.id }}">{{ e.name }} ({{ e.duration }} min)</option>{% endfor %}
    </select>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">Date</label>
    <input type="date" name="slot_date" class="form-control" value="{{ slot.slot_date if slot }}" required>
  </div>
  <div class="row">
    <div class="col mb-3">
      <label class="form-label">Start time</label>
      <input type="time" name="start_time" class="form-control" value="{{ slot.start_time.strftime('%H:%M') if slot }}" required>
    </div>
    <div class="col mb-3">
      <label class="form-label">End time</label>
      <input type="time" name="end_time" class="form-control" value="{{ slot.end_time.strftime('%H:%M') if slot }}" required>
    </div>
  </div>
  <div class="row">
    <div class="col mb-3">
      <label class="form-label">Capacity (students)</label>
      <input type="number" min="1" name="capacity" class="form-control" value="{{ slot.capacity if slot else 1 }}" required>
    </div>
    <div class="col mb-3">
      <label class="form-label">Venue or link</label>
      <input name="venue" class="form-control" value="{{ slot.venue or '' if slot }}">
    </div>
  </div>
  <button class="btn btn-primary">Save slot</button>
  <a class="btn btn-link" href="{{ url_for('examiner_dashboard') }}">Cancel</a>
</form>
{% endif %}
{% endblock %}
