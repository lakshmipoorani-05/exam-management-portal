{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Examinations</h3>
  <a class="btn btn-primary" href="{{ url_for('admin_exam_new') }}">+ New Examination</a>
</div>

<table class="table table-striped bg-white">
  <thead>
    <tr><th>ID</th><th>Name</th><th>Course</th><th>Type</th><th>Marks</th><th>Status</th><th></th></tr>
  </thead>
  <tbody>
    {% for e in exams %}
    <tr>
      <td>{{ e.id }}</td>
      <td>{{ e.name }}</td>
      <td>{{ e.course.code }}</td>
      <td>{{ e.exam_type }}</td>
      <td>{{ e.max_marks }}</td>
      <td><span class="badge bg-secondary">{{ e.status }}</span></td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin_exam_edit', exam_id=e.id) }}">Edit</a>
        <form method="post" action="{{ url_for('admin_exam_delete', exam_id=e.id) }}" class="d-inline">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="7" class="text-center text-muted">No examinations yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
