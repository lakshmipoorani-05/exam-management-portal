{% extends "base.html" %}

{% block content %}
<h3>{{ "Edit" if exam else "New" }} Examination</h3>

{% if not courses %}
  <div class="alert alert-info">Create an active course first.</div>
{% else %}
<form method="post" class="card card-body col-lg-8">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Course</label>
      <select name="course_id" class="form-select" required>
        {% for c in courses %}
          <option value="{{ c.id }}" {{ "selected" if exam and exam.course_id == c.id }}>{{ c.code }} - {{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Examination name</label>
      <input name="name" class="form-control" value="{{ exam.name if exam else '' }}" required>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Type</label>
      <select name="exam_type" class="form-select">
        {% for t in exam_types %}
          <option {{ "selected" if exam and exam.exam_type == t }}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Duration (minutes)</label>
      <input type="number" min="1" name="duration" class="form-control" value="{{ exam.duration if exam else 15 }}" required>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Maximum marks</label>
      <input type="number" min="1" name="max_marks" class="form-control" value="{{ exam.max_marks if exam else 100 }}" required>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Slot creation start</label>
      <input type="date" name="slot_create_start" class="form-control" value="{{ exam.slot_create_start if exam }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Slot creation end</label>
      <input type="date" name="slot_create_end" class="form-control" value="{{ exam.slot_create_end if exam }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Booking start</label>
      <input type="date" name="booking_start" class="form-control" value="{{ exam.booking_start if exam }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Booking end</label>
      <input type="date" name="booking_end" class="form-control" value="{{ exam.booking_end if exam }}" required>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Instructions</label>
    <textarea name="instructions" class="form-control">{{ exam.instructions or "" if exam else "" }}</textarea>
  </div>

  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('admin_exams') }}">Cancel</a>
</form>
{% endif %}
{% endblock %}
